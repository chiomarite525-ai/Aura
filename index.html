<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KASSY CHUKWU AURA | PRO SHOWROOM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f1f5f9; font-family: 'Inter', sans-serif; color: #0f172a; }
        .aura-header { background: #0f172a; color: white; border-radius: 0 0 40px 40px; }
        .glass-panel { background: white; border-radius: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
        .pulse-card { background: white; border-radius: 24px; min-width: 260px; border: 1px solid #e2e8f0; }
        
        /* 3D Book Specification */
        .stage { perspective: 1500px; display: flex; justify-content: center; padding: 40px 0; }
        .book { width: 220px; height: 320px; position: relative; transform-style: preserve-3d; transform: rotateY(-20deg); }
        .front { position: absolute; width: 100%; height: 100%; background: white; border-radius: 2px 12px 12px 2px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #cbd5e1; box-shadow: 20px 20px 40px rgba(0,0,0,0.1); }
        .spine { position: absolute; width: 30px; height: 100%; background: #2563eb; transform: rotateY(-90deg) translateZ(15px); left: -15px; display: flex; align-items: center; justify-content: center; color: white; }
        .spine-text { transform: rotate(90deg); white-space: nowrap; font-size: 9px; font-weight: 900; letter-spacing: 1px; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-20">

    <header class="aura-header p-8 mb-10 shadow-2xl">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black italic tracking-tighter uppercase">Kassy Chukwu <span class="text-blue-400">Aura ></span></h1>
            <div class="flex items-center gap-6">
                <span class="text-[10px] font-bold opacity-40 tracking-widest uppercase">Feb 19, 2026</span>
                <button class="bg-blue-600 px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest shadow-lg shadow-blue-900/20">Access Gallery</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4">
        
        <div class="glass-panel p-10 mb-12">
            <div class="flex flex-col lg:flex-row gap-10">
                <div class="flex-1">
                    <h2 class="text-xl font-black mb-6 text-slate-800 uppercase tracking-tight">Create Undetectable Content</h2>
                    <div class="bg-slate-50 border-2 border-slate-100 rounded-[35px] p-8 mb-8">
                        <textarea id="bookInput" placeholder="What masterpiece are we creating today?" class="w-full h-32 bg-transparent outline-none text-xl resize-none text-slate-700"></textarea>
                        <div class="flex gap-6 text-slate-300 mt-6 border-t pt-4">
                            <i class="fas fa-link cursor-pointer hover:text-blue-500 transition-all"></i>
                            <i class="fas fa-file-pdf cursor-pointer hover:text-blue-500 transition-all"></i>
                            <i class="fas fa-microphone cursor-pointer hover:text-blue-500 transition-all"></i>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
                        <button class="bg-blue-600 text-white font-black py-4 rounded-2xl text-[10px] uppercase">Video → Book</button>
                        <button class="bg-blue-600 text-white font-black py-4 rounded-2xl text-[10px] uppercase">PDF Master</button>
                        <button class="bg-blue-600 text-white font-black py-4 rounded-2xl text-[10px] uppercase">Aura Summary</button>
                        <button class="bg-blue-600 text-white font-black py-4 rounded-2xl text-[10px] uppercase">Style Sync</button>
                    </div>

                    <button onclick="ignite()" id="mainBtn" class="w-full bg-blue-600 text-white font-black py-6 rounded-3xl text-xl uppercase tracking-widest shadow-xl shadow-blue-200 active:scale-95 transition-all">
                        Ignite Aura Engine
                    </button>
                </div>

                <div class="w-full lg:w-72 bg-slate-50 rounded-[40px] p-6">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">Avatar Sync</h3>
                    <div class="grid grid-cols-4 gap-3">
                        <script>
                            for(let i=1; i<=12; i++) {
                                document.write(`<div class="aspect-square rounded-xl bg-white border border-slate-200 overflow-hidden"><img src="https://i.pravatar.cc/150?u=aura${i}" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all"></div>`);
                            }
                        </script>
                    </div>
                </div>
            </div>
        </div>

        <section class="mb-16">
            <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em] mb-6 px-2">Global Pulse Metrics</h3>
            <div class="flex gap-6 overflow-x-auto no-scrollbar pb-6 px-2">
                <div class="pulse-card p-6 flex items-center gap-5">
                    <div class="w-14 h-14 bg-black rounded-2xl flex items-center justify-center text-white text-3xl shadow-lg"><i class="fab fa-tiktok"></i></div>
                    <div><h4 class="font-black text-sm uppercase">TikTok</h4><p class="text-[10px] text-slate-400 font-bold tracking-widest">#KASSYAURA</p></div>
                    <div class="ml-auto bg-red-100 text-red-600 text-[8px] font-black px-3 py-1.5 rounded-full uppercase">Trending</div>
                </div>
                <div class="pulse-card p-6 flex items-center gap-5">
                    <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-3xl shadow-lg"><i class="fab fa-instagram"></i></div>
                    <div><h4 class="font-black text-sm uppercase">Instagram</h4><p class="text-[10px] text-slate-400 font-bold tracking-widest">@AuraShowroom</p></div>
                    <div class="ml-auto bg-green-100 text-green-600 text-[8px] font-black px-3 py-1.5 rounded-full uppercase">Verified</div>
                </div>
            </div>
        </section>

        <div id="showroom" class="hidden">
            <div class="stage">
                <div class="book">
                    <div class="front">
                        <span class="text-[8px] font-black text-blue-600 uppercase tracking-widest">Aura Production</span>
                        <h3 id="bookTitle" class="text-2xl font-black text-slate-800 leading-tight"></h3>
                        <div class="border-t pt-3 text-[10px] font-bold text-slate-400 uppercase italic">Kassy Chukwu Aura</div>
                    </div>
                    <div class="spine"><div class="spine-text uppercase">PRO MANUSCRIPT 2026</div></div>
                </div>
            </div>

            <div id="printArea" class="max-w-3xl mx-auto bg-white p-16 rounded-[50px] shadow-2xl border border-slate-100 mb-10">
                <div id="bookBody" class="text-xl leading-relaxed text-slate-700 italic whitespace-pre-wrap"></div>
            </div>

            <div class="flex flex-wrap justify-center gap-6 mb-20">
                <button onclick="downloadPDF()" class="bg-slate-900 text-white px-10 py-5 rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl flex items-center gap-3"><i class="fas fa-file-pdf"></i> Download PDF</button>
                <button onclick="shareWhatsApp()" class="bg-green-600 text-white px-10 py-5 rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl flex items-center gap-3"><i class="fab fa-whatsapp"></i> Share with Client</button>
            </div>
        </div>

    </main>

    <footer class="text-center py-10 opacity-40">
        <p class="text-[11px] font-black text-slate-500 uppercase tracking-[0.6em]">App is designed by Precious Alakpa</p>
    </footer>

    <script>
        function ignite() {
            const input = document.getElementById('bookInput').value;
            if(!input) return alert("The Aura engine requires a title to begin.");
            
            const btn = document.getElementById('mainBtn');
            btn.innerText = "CRAFTING MASTERPIECE...";
            btn.disabled = true;

            setTimeout(() => {
                const protection = "\n\n---\nDIGITAL PROTECTION ACTIVE: Kassy Chukwu Aura Showroom\nInternational Brand Protection Protocol: #AURA-2026-X\nVerified Human Content. No ISBN Required.";
                
                const content = `THE PREFACE\n\nWhen we look at "${input}", we aren't just seeing a topic. We are seeing a conversation. As a close friend, I want to guide you through this journey with an undetectable touch that only the Aura can provide.\n\nCHAPTER 1: THE DISCOVERY\n\nThis manuscript is designed to give you international recognition instantly. By focusing on the unique voice that only you possess, we ensure that "${input}" becomes a legacy, not just a document.\n\n` + protection;

                document.getElementById('bookTitle').innerText = input.toUpperCase();
                document.getElementById('bookBody').innerText = content;
                document.getElementById('showroom').classList.remove('hidden');
                document.getElementById('showroom').scrollIntoView({ behavior: 'smooth' });

                btn.innerText = "Ignite Aura Engine";
                btn.disabled = false;
            }, 1000);
        }

        function downloadPDF() {
            const element = document.getElementById('printArea');
            const title = document.getElementById('bookTitle').innerText;
            html2pdf().from(element).save(`KassyChukwuAura_${title}.pdf`);
        }

        function shareWhatsApp() {
            const title = document.getElementById('bookTitle').innerText;
            const text = encodeURIComponent(`Check out this new manuscript generated by Kassy Chukwu Aura: ${title}`);
            window.open(`https://wa.me/?text=${text}`);
        }
    </script>
</body>
</html>
